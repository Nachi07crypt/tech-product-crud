<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tech Product Showcase</title>
<style>
  body{font-family:system-ui,Arial,sans-serif;margin:0;background:#f4f6fa;color:#222}
  header{background:#1f3a68;color:#fff;padding:16px 24px}
  main{max-width:1000px;margin:20px auto;padding:0 16px}
  form,.card{background:#fff;padding:16px;border-radius:8px;box-shadow:0 1px 4px #0002;margin-bottom:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
  label{font-size:13px;display:block}
  input,textarea{width:100%;padding:8px;box-sizing:border-box;border:1px solid #ccc;border-radius:4px}
  button{padding:8px 14px;border:0;border-radius:4px;cursor:pointer;color:#fff;background:#1f3a68;margin-top:10px}
  button.edit{background:#d68910;margin:0}button.del{background:#c0392b;margin:0}button.cancel{background:#777}
  .scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left;white-space:nowrap}th{background:#eef1f7}
  #msg{padding:8px;margin-bottom:10px;border-radius:4px;display:none}
</style>
</head>
<body>
<header><h2 style="margin:0">Tech Product Showcase</h2></header>
<main>
  <div id="msg"></div>
  <form id="productForm">
    <h3 id="formTitle">Add Product</h3>
    <input type="hidden" id="id">
    <div class="grid">
      <label>Product name *<input id="product_name" required></label>
      <label>Brand<input id="brand"></label>
      <label>Category<input id="category"></label>
      <label>Price<input id="price" type="number" step="0.01" min="0" value="0"></label>
      <label>Stock<input id="stock" type="number" min="0" value="0"></label>
    </div>
    <label style="margin-top:10px">Description<textarea id="description" rows="2"></textarea></label>
    <button type="submit" id="saveBtn">Save</button>
    <button type="button" class="cancel" id="cancelBtn" style="display:none">Cancel</button>
  </form>
  <div class="card scroll">
    <table>
      <thead><tr><th>ID</th><th>Name</th><th>Brand</th><th>Category</th><th>Price</th><th>Stock</th><th>Description</th><th>Updated</th><th>Actions</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
